services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:sqlite:/app/data/onticoworkshop.db
    volumes:
      - backend-data:/app/data

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend-only
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend-data:
    driver: local
